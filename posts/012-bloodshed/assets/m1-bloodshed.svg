<text x="80" y="704" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e">Conditional extrapolation, not a forecast. Police-recorded home burglaries × share with someone home (ONS; BJS) × 4.6%, the</text>
