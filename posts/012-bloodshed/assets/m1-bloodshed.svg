<text x="80" y="758" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#52514e">who meets the holder of a bitcoin fortune behaves like a wrench attacker. Ukraine: UN-verified civilian deaths only, no soldiers.</text>
