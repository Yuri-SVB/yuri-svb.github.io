<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="80" y="118" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" letter-spacing="4" fill="#8a8781">A CARTEIRA-ISCA, OU DECOY</text>
<rect x="80" y="170" width="440" height="230" fill="none" stroke="#0b0b0b" stroke-width="3"/>
<text x="110" y="228" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#52514e">o que você entrega</text>
<text x="110" y="310" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="#0b0b0b">R$ 8.000</text>
<text x="110" y="358" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#8a8781">e ele vai embora, na teoria</text>
<rect x="600" y="170" width="440" height="230" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="12 10"/>
<text x="630" y="228" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#52514e">o que ele acredita que existe</text>
<text x="630" y="330" font-family="Georgia,'Times New Roman',serif" font-size="120" fill="#eb6834">?</text>
<text x="630" y="372" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#8a8781">e não há como encerrar a dúvida</text>
<text x="80" y="500" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#0b0b0b">Funciona se o ataque durar minutos.</text>
<text x="80" y="552" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#0b0b0b">No Brasil, 75% são sequestros.</text>
<text x="80" y="612" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#8a8781">Registro de Jameson Lopp, n=12 para o Brasil. Amostra de imprensa, direcional.</text>
</svg>