<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="80" y="82" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" letter-spacing="4" fill="#8a8781">WHERE THE INCENTIVE LIVES</text>

<rect x="80" y="150" width="240" height="150" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="3"/>
<text x="104" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="29" fill="#0b0b0b">the attack</text>
<text x="104" y="250" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="29" fill="#0b0b0b">clearly fails</text>
<text x="104" y="286" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#8a8781">you keep the coins</text>

<rect x="380" y="150" width="440" height="150" fill="#f0ede6" stroke="#eb6834" stroke-width="5"/>
<text x="404" y="206" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#0b0b0b">the race</text>
<text x="404" y="248" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#52514e">he has a path. you are alive.</text>
<text x="404" y="280" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#52514e">removing you is what raises his odds.</text>

<rect x="880" y="150" width="240" height="150" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="3"/>
<text x="904" y="212" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="29" fill="#0b0b0b">the attack</text>
<text x="904" y="250" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="29" fill="#0b0b0b">clearly wins</text>
<text x="904" y="286" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#8a8781">you lose the coins</text>

<line x1="80" y1="340" x2="1120" y2="340" stroke="#0b0b0b" stroke-width="3"/>
<text x="80" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#8a8781">survivable</text>
<text x="524" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#eb6834">not survivable</text>
<text x="1020" y="374" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#8a8781">survivable</text>

<text x="80" y="472" font-family="Georgia,'Times New Roman',serif" font-size="54" fill="#0b0b0b">Clear success or clear failure &#8212; never a race.</text>

<text x="82" y="540" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#52514e">Decision-theoretic, not cryptographic: a claim about what a rational attacker is paid to do,</text>
<text x="82" y="574" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#52514e">not about breaking a cipher. Strong encryption does not move any of these three boxes.</text>
<text x="82" y="616" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#52514e">16 of 351 registry incidents record a killed victim: 4.6%, and a floor, not an estimate.</text>
<text x="82" y="652" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8a8781">doi.org/10.5281/zenodo.22018891</text>
</svg>
