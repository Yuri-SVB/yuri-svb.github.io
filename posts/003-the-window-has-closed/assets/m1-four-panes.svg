<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="190" y="160" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" letter-spacing="4" fill="#8a8781">WHAT HAD TO GO RIGHT FOR YOU</text>
<rect x="168" y="228" width="852" height="652" fill="none" stroke="#0b0b0b" stroke-width="6"/>

  <rect x="190" y="250" width="390" height="290" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="3"/>
  <text x="220" y="316" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#8a8781">①</text>
  <text x="220" y="418" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#0b0b0b">they didn't know</text>
  <text x="220" y="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#0b0b0b">what it was</text>
  <rect x="608" y="250" width="390" height="290" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="3"/>
  <text x="638" y="316" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#8a8781">②</text>
  <text x="638" y="418" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#0b0b0b">they wouldn't</text>
  <text x="638" y="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#0b0b0b">meet you</text>
  <rect x="190" y="568" width="390" height="290" fill="#f0ede6" stroke="#0b0b0b" stroke-width="3"/>
  <text x="220" y="634" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#8a8781">③</text>
  <text x="220" y="736" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#8a8781">they couldn't tell</text>
  <text x="220" y="778" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#8a8781">it was you</text>
  <line x1="204" y1="582" x2="566" y2="844" stroke="#eb6834" stroke-width="6" stroke-linecap="round"/>
  <line x1="566" y1="582" x2="204" y2="844" stroke="#eb6834" stroke-width="6" stroke-linecap="round"/>
  <rect x="608" y="568" width="390" height="290" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="3"/>
  <text x="638" y="634" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#8a8781">④</text>
  <text x="638" y="736" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#0b0b0b">you knew more</text>
  <text x="638" y="778" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" fill="#0b0b0b">than they did</text>
<text x="190" y="985" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#0b0b0b">The window has closed.</text>
<text x="192" y="1042" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#52514e">③ was the one that mattered. Identification was the whole defense.</text>
<text x="192" y="1088" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#52514e">A claim about incentives, not a measurement. ④ is narrative — nobody surveyed burglars in 2013.</text>
</svg>