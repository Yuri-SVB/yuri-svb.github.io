<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="120" y="230" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" letter-spacing="4" fill="#8a8781">REPORTED HOME INVASIONS</text>
<text x="120" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" fill="#52514e">of 52 wrench-attack incidents</text>
<text x="140" y="620" font-family="Georgia,'Times New Roman',serif" font-size="150" fill="#8a8781">1</text>
<text x="140" y="670" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#8a8781">H1 2025</text>
<path d="M 330 570 L 500 570 M 455 535 L 502 570 L 455 605" fill="none" stroke="#0b0b0b" stroke-width="5" stroke-linecap="round"/>
<text x="560" y="640" font-family="Georgia,'Times New Roman',serif" font-size="300" fill="#eb6834">20</text>
<text x="565" y="700" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#52514e">H1 2026</text>
<line x1="120" y1="800" x2="1080" y2="800" stroke="#8a8781" stroke-width="2"/>
<text x="120" y="890" font-family="Georgia,'Times New Roman',serif" font-size="64" fill="#0b0b0b">The attack is moving to</text>
<text x="120" y="960" font-family="Georgia,'Times New Roman',serif" font-size="64" fill="#0b0b0b">where people live.</text>
<text x="120" y="1060" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#8a8781">Industry count, H1 2025 → H1 2026. Verified incidents only; press- and disclosure-sourced,</text>
<text x="120" y="1092" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" fill="#8a8781">so it misses what goes unreported. Directional, not an incidence rate.</text>
</svg>